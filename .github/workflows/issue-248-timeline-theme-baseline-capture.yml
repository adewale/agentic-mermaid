name: Issue 248 Timeline theme baseline capture

on:
  push:
    branches: [codex/248-timeline-theme]

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install chromium --with-deps
      - name: Capture exact Linux website payload
        run: |
          bun run website:payload:write
          mkdir capture
          cp eval/website-payload/baseline.json capture/website-baseline.json
      - uses: actions/upload-artifact@v7
        with:
          name: issue-248-timeline-theme-baseline-${{ github.sha }}
          path: capture/
          if-no-files-found: error
