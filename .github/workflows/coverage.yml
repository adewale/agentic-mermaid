name: Bundle exemption review evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true
      - name: Preserve the generator and check out the immutable candidate
        run: |
          cp scripts/pr-assets/bundle-exemption-evidence.ts "$RUNNER_TEMP/bundle-exemption-evidence.ts"
          git checkout --detach 6a4284f65ab5cf4edeb206ca2382e20eee73a34a
          git worktree add --detach ../bundle-evidence-base c31d16d002adcad518b7fa9fa67f85d9be26eba6
      - name: Install the frozen dependencies in both revisions
        run: |
          bun install --frozen-lockfile
          cd ../bundle-evidence-base
          bun install --frozen-lockfile
      - name: Render the same injected fault through both production pipelines
        run: |
          bun "$RUNNER_TEMP/bundle-exemption-evidence.ts" "$GITHUB_WORKSPACE/../bundle-evidence-base" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/bundle-exemption-review"
          cp "$RUNNER_TEMP/bundle-exemption-evidence.ts" "$RUNNER_TEMP/bundle-exemption-review/"
      - name: Attach generated evidence
        uses: actions/upload-artifact@v7
        with:
          name: bundle-exemptions-6a4284f
          path: ${{ runner.temp }}/bundle-exemption-review/
          if-no-files-found: error
          retention-days: 30
