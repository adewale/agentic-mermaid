name: Unit coverage diagnostic

# Coverage locates under-tested source; behavioral assertions remain in CI.
# Instrumentation is expensive on the corpus/property suites, so collect it
# weekly and on demand rather than slowing every pull request.
on:
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-diagnostic
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Build the Node bundle for cross-runtime contracts
        run: bunx --no-install tsup
      - name: Run covered unit shard
        run: bun run test:coverage -- --shard=${{ matrix.shard }} --parallel=2
      - name: Upload shard coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-coverage-${{ strategy.job-index }}
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

  merge:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
          no-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: unit-coverage-*
          path: coverage-shards
      - run: bun run scripts/ci/merge-lcov.ts coverage-shards coverage/lcov.info 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
