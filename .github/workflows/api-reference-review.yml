name: API reference review evidence
on:
  push:
    branches: [review/api-reference-evidence]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      options: --init --ipc=host
    strategy:
      matrix:
        include:
          - label: base
            revision: cd5dfe4a84ddd7b88e987b3f90045b042c8792ca
          - label: head
            revision: 78c5f0dac3fbf5c6d2cf3515dde10961a8f243bd
    steps:
      - uses: actions/checkout@v7
        with:
          path: review
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.revision }}
          path: source
      - run: npm install --global bun@1.4.2
      - run: bun install --frozen-lockfile && bun run website
        working-directory: source
      - run: node review/.github/scripts/api-reference-review.mjs source images ${{ matrix.label }}
      - uses: actions/upload-artifact@v7
        with:
          name: api-reference-${{ matrix.label }}-${{ matrix.revision }}
          path: images/
          retention-days: 30
