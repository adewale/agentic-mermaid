name: Issue 248 Scene break payload capture

on:
  push:
    branches: [codex/248-scene-br-regression]

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium --with-deps
      - run: bun run build
      - run: bun run website:payload:write
      - uses: actions/upload-artifact@v7
        with:
          name: issue-248-scene-br-payload-${{ github.sha }}
          path: eval/website-payload/baseline.json
          if-no-files-found: error
