name: Temporary issue 294 Journey delimiter capture

on:
  push:
    branches: [codex/issue-294-journey-delimiter-linear]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium --with-deps
      - run: bun run gallery:mermaid-docs
      - run: bun run gallery:mindmap-gitgraph
      - run: bun run gallery:section-b
      - run: bun run website:payload:write
      - uses: actions/upload-artifact@v7
        with:
          name: issue-294-journey-delimiter-${{ github.sha }}
          path: |
            docs/design/families/mermaid-doc-examples-all-families.png
            docs/design/families/mindmap-content-gallery.png
            docs/design/families/gitgraph-content-gallery.png
            docs/design/families/section-b-brand-evidence.png
            eval/mermaid-doc-showcase/gallery-receipt.json
            eval/mindmap-gitgraph-content-corpus/gallery-receipt.json
            eval/section-b-brand-evidence/evidence-receipt.json
            eval/website-payload/baseline.json
          if-no-files-found: error
