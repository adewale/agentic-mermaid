name: Temporary issue 248 Class member Bun 1.4.2 capture

on:
  push:
    branches: [codex/248-class-member-text]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium --with-deps
      - run: bun run build
      - run: npm pack --dry-run --json > package-files-capture.json
      - run: bun run gallery:section-b
      - run: bun run website:payload:write
      - uses: actions/upload-artifact@v7
        with:
          name: issue-248-class-member-bun142-${{ github.sha }}
          path: |
            docs/design/families/section-b-brand-evidence.png
            eval/section-b-brand-evidence/evidence-receipt.json
            eval/website-payload/baseline.json
            package-files-capture.json
          if-no-files-found: error
