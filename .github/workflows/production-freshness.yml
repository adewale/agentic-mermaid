name: Production freshness

# A green "Deploy website to Cloudflare" run proves only the deploys that ran.
# This read-only check compares the build agentic-mermaid.dev actually serves
# (capabilities.json generatedFrom.gitSha) with the newest main commit that
# passed canonical CI, and fails once main has carried undeployed commits for
# more than MAX_DRIFT_DAYS. This is the one delayed signal for unpublished
# main: ordinary between-release deploy skips stay non-failing, while sustained
# drift becomes actionable after the grace period. It never deploys or publishes.

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      MAX_DRIFT_DAYS: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          # Dating the drift walks main's first-parent history back to the
          # live commit.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Resolve the newest deployable main commit
        id: deployable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh api -X GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f per_page=1)"
          sha="$(jq -er '.workflow_runs[0].head_sha' <<<"$runs")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ok   newest main commit with successful CI is $sha"

      - name: Compare production with deployable main
        env:
          DEPLOYABLE_SHA: ${{ steps.deployable.outputs.sha }}
        run: bun run scripts/ci/production-freshness.ts --deployable-sha "$DEPLOYABLE_SHA" --max-drift-days "$MAX_DRIFT_DAYS"
