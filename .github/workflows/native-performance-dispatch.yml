name: Dispatch exact-head performance qualification
on:
  push:
    branches: [codex/performance-dispatch-20261024]
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch complete calibrated semantic campaign against pinned main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api repos/adewale/agentic-mermaid/git/ref/heads/codex/cold-peer-calibration --jq .object.sha)"
          test "$head" = 1da0ca7d91d351184eec56ff8c31b93496386a28
          runtime="$(gh api repos/adewale/agentic-mermaid/git/ref/heads/codex/native-construction-performance --jq .object.sha)"
          test "$runtime" = 2ad2d56da931d5aed16d3322c3f2220a0a70de46
          gh api --method POST repos/adewale/agentic-mermaid/actions/workflows/release-benchmark.yml/dispatches --input - <<'JSON'
          {"ref":"codex/cold-peer-calibration","inputs":{"evidence-scope":"all","baseline-ref":"9b64b5f42a8260696052f8218fccfacd8ae44b80","fixed-baseline-sha":"2cff725d219c75b75593b1d3e9bacd74cba7a08e"}}
          JSON
