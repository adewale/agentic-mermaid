name: Dispatch exact-head performance qualification
on:
  push:
    branches: [codex/performance-dispatch-20261024]
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Retain and cancel invalidated warmup-source campaign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh api repos/adewale/agentic-mermaid/actions/runs/40129917354 --jq .status)"
          if [ "$state" != completed ]; then
            gh api --method POST repos/adewale/agentic-mermaid/actions/runs/40129917354/cancel
          fi
