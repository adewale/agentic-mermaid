name: Retain obsolete-base benchmark evidence
on:
  push:
    branches: [codex/performance-dispatch-20261024]
permissions:
  contents: read
jobs:
  retire-obsolete-base:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Stop only superseded c7fa0ad after retaining its complete release reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api repos/adewale/agentic-mermaid/actions/runs/40167575588 --jq .head_sha)"
          test "$head" = c7fa0ad3384157032dd65b60ca22a246658c00e0
          main="$(gh api repos/adewale/agentic-mermaid/git/ref/heads/main --jq .object.sha)"
          test "$main" = 1c151890eb371b7d4bcaf98b1d8c2dc59f149cc8
          state="$(gh api repos/adewale/agentic-mermaid/actions/runs/40167575588 --jq .status)"
          if [ "$state" != completed ]; then
            gh api --method POST repos/adewale/agentic-mermaid/actions/runs/40167575588/cancel
          fi
