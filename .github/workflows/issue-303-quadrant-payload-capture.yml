name: Temporary issue 303 Quadrant authored-color payload capture

on:
  push:
    branches:
      - codex/248-quadrant-authored-colors

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - run: bun run website:payload:write
      - uses: actions/upload-artifact@v7
        with:
          name: issue-303-quadrant-linux-payload
          path: eval/website-payload/baseline.json
          if-no-files-found: error
      - run: bun run build
      - run: bun run scripts/build/browser-lazy-report.ts --json > /tmp/am337-lazy.json
      - uses: actions/upload-artifact@v7
        with:
          name: issue-303-quadrant-linux-lazy
          path: /tmp/am337-lazy.json
          if-no-files-found: error
      - run: npm pack --dry-run --json --ignore-scripts > /tmp/am337-pack.json
      - uses: actions/upload-artifact@v7
        with:
          name: issue-303-quadrant-linux-pack
          path: /tmp/am337-pack.json
          if-no-files-found: error
