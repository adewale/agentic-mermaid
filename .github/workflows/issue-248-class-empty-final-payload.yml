name: Temporary issue 248 Class empty-body final payload

on:
  push:
    branches: [codex/248-class-empty-body]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium --with-deps
      - run: bun run website:payload:write
      - uses: actions/upload-artifact@v7
        with:
          name: issue-248-class-empty-payload-${{ github.sha }}
          path: eval/website-payload/baseline.json
          if-no-files-found: error
