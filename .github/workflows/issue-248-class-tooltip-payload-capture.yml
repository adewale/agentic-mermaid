name: Temporary issue 248 Class tooltip payload capture

on:
  push:
    branches: [codex/issue-248-class-tooltips]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium --with-deps
      - run: bun run website:payload:write
      - uses: actions/upload-artifact@v7
        with:
          name: issue-248-class-tooltip-payload-${{ github.sha }}
          path: eval/website-payload/baseline.json
          if-no-files-found: error
