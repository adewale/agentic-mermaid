name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep CI on the known-good runtime used for local/release validation.
          # `latest` moved underneath this PR and made coverage runs flaky.
          # Every workflow pins the same Bun: at least engines.bun, and one
          # toolchain so the payload delta's base and head builds compare like
          # with like (bun-version.test.ts).
          bun-version: 1.4.2
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the Node bundle for cross-runtime determinism contracts
        run: bun run build

      - name: Setup Node for the reviewed package manifest
        if: ${{ matrix.shard == '1/3' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install the pinned publishing npm for manifest verification
        if: ${{ matrix.shard == '1/3' }}
        run: |
          npm install -g npm@11.18.0 --ignore-scripts
          test "$(npm --version)" = "11.18.0"

      - name: Verify the reviewed npm package file manifest
        if: ${{ matrix.shard == '1/3' }}
        run: bun run scripts/ci/verify-publish-package.ts --pack-destination ci-release-artifact

      - name: Reject a divergent already-published immutable npm version
        if: ${{ matrix.shard == '1/3' }}
        run: bun run scripts/ci/published-version.ts

      # The file manifest proves which files ship; publint and attw prove the
      # shipped exports resolve and carry types for Node ESM and bundlers.
      - name: Lint the packed package's exports and types
        if: ${{ matrix.shard == '1/3' }}
        run: bun run lint:package

      - name: Run test shard (coverage = under-tested finder, NOT an adequacy target)
        # The pass/fail of this suite is the gate. Coverage is merged from all
        # three shards only to locate under-tested files — it is deliberately
        # NOT a quality target:
        # line coverage is weakly correlated with fault detection once suite
        # size is controlled (Inozemtseva & Holmes, ICSE 2014). Treat it as one
        # diagnostic alongside the behavioral, property, differential, and
        # fault-injection checks below rather than promoting any single proxy
        # to an overall adequacy score.
        # Coverage is lcov-only (see bunfig.toml [test].coverageReporter —
        # bunfig overrides any --coverage-reporter CLI flag): the text table
        # intermittently kills bun's stdout writer with `error: An internal
        # error occurred (WriteFailed)`, exiting 1 with zero test failures
        # (runs 28576001032, 28576303182). The pass/fail summary still prints.
        # Coverage makes corpus and adversarial tests several times slower on
        # shared runners. The canonical package script owns their one bounded
        # command-line default so local, CI, and release gates cannot drift;
        # CI appends only Bun's deterministic file-shard selector and runs the
        # shard's files in two isolated worker processes (--parallel implies
        # --isolate, so a file can no longer lean on another file's imports).
        # Two, not the runner's four: with coverage on, four workers starved the
        # subprocess- and upstream-Mermaid-heavy tests into 30s timeouts (nine
        # in a local four-core run); two workers ran the full suite clean.
        run: bun run test -- --shard=${{ matrix.shard }} --parallel=2

      - name: Upload shard coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-${{ strategy.job-index }}
          path: coverage/lcov.info
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

  quality:
    name: Quality gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true

      # This is the same aggregate developers run locally. It installs the
      # frozen dependency graph, runs every QUALITY_CHECKS gate in
      # scripts/ci/quality-gates.ts, and reports all failures in one pass.
      - name: Run the complete local and CI quality suite
        run: bun run quality:check


  mcp-conformance:
    name: MCP conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Setup Node for the official conformance CLI
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run pinned official MCP conformance scenarios
        run: bun run eval:mcp-conformance

  # CLAUDE.md good-pr dimension 4, checked mechanically: when a PR changes
  # production code and tests, at least one changed test must fail against the
  # base branch's production code. Pure refactors opt out with the
  # `no-red-green` label, which approves only the head it was applied to
  # (scripts/ci/label-approval.ts); re-running the job after labelling works.
  red-green:
    name: Changed tests fail on the base branch
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run changed tests against the base branch's production code
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if bun run scripts/ci/label-approval.ts check --label no-red-green; then
            echo "Skipped: no-red-green approves this head."
            exit 0
          fi
          bun run scripts/ci/red-green.ts --base "$BASE_SHA"

  # A label approval covers the head it was applied to. When new commits
  # arrive, remove the approval labels applied before them, as GitHub dismisses
  # stale reviews. The checks that read the labels apply the same rule, so they
  # ignore a stale label even if they read it before this job removes it.
  expire-label-approvals:
    name: Expire label approvals of earlier heads
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Remove approval labels applied to an earlier head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
        run: bun run scripts/ci/label-approval.ts expire

  # Preserve the existing required check name while the work behind it runs in
  # parallel. always() turns a failed or cancelled prerequisite into a failed
  # aggregate gate instead of a misleading skipped check.
  test:
    runs-on: ubuntu-latest
    needs: [unit, quality, mcp-conformance]
    if: ${{ always() }}

    steps:
      - uses: actions/checkout@v7
        if: ${{ needs.unit.result == 'success' }}

      - name: Setup Bun for coverage merge
        if: ${{ needs.unit.result == 'success' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Download shard coverage
        if: ${{ needs.unit.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: unit-coverage-*
          path: coverage-shards

      - name: Merge shard coverage
        if: ${{ needs.unit.result == 'success' }}
        run: bun run scripts/ci/merge-lcov.ts coverage-shards coverage/lcov.info 3

      - name: Upload merged coverage
        if: ${{ needs.unit.result == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          overwrite: true
          retention-days: 7

      - name: Require every test lane to pass
        if: ${{ always() }}
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          MCP_CONFORMANCE_RESULT: ${{ needs['mcp-conformance'].result }}
        run: |
          if [[ "$UNIT_RESULT" != "success" || "$QUALITY_RESULT" != "success" || "$MCP_CONFORMANCE_RESULT" != "success" ]]; then
            echo "unit=$UNIT_RESULT quality=$QUALITY_RESULT mcp-conformance=$MCP_CONFORMANCE_RESULT"
            exit 1
          fi

  e2e:
    name: E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        suite: [cli, dist-artifact, tarball-consumer, tarball-consumer-node22, browser]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep CI on the known-good runtime used for local/release validation.
          # `latest` moved underneath this PR and made coverage runs flaky.
          # Every workflow pins the same Bun: at least engines.bun, and one
          # toolchain so the payload delta's base and head builds compare like
          # with like (bun-version.test.ts).
          bun-version: 1.4.2
          no-cache: true

      - name: Setup Node for shipped-artifact gates
        if: ${{ matrix.suite == 'dist-artifact' || matrix.suite == 'tarball-consumer' || matrix.suite == 'tarball-consumer-node22' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.suite == 'tarball-consumer-node22' && '22' || '24' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        if: ${{ matrix.suite == 'browser' }}
        run: bunx playwright install chromium firefox webkit --with-deps

      - name: Run CLI E2E tests
        if: ${{ matrix.suite == 'cli' }}
        # Unit tests are the coverage gate; e2e/bunfig.toml disables coverage
        # instrumentation for browser/binary E2E.
        run: cd e2e && bun test cli-smoke.e2e.test.ts cli.e2e.test.ts fresh-checkout.e2e.test.ts --timeout 120000

      - name: Run single-binary E2E tests
        if: ${{ matrix.suite == 'cli' }}
        run: cd e2e && bun test single-binary.e2e.test.ts --timeout 180000

      - name: Run dist-artifact differential fuzz (built bundle under plain Node)
        if: ${{ matrix.suite == 'dist-artifact' }}
        # Builds dist/ and fuzzes the shipped bundle under Node against the
        # source build (crash parity across families + byte-equality on
        # flowcharts). Node is pinned above; a missing binary fails the suite.
        run: cd e2e && bun test dist-artifact-fuzz.e2e.test.ts --timeout 400000

      - name: Run tarball-consumer fuzz (npm pack -> install -> drive bins under Node)
        if: ${{ matrix.suite == 'tarball-consumer' || matrix.suite == 'tarball-consumer-node22' }}
        # Packs, installs into a clean project, and fuzzes the installed library
        # + `am`/`agentic-mermaid-mcp` bins as spawned Node processes — the real
        # consumer path (exports resolution, files[], bin linking, native deps).
        run: cd e2e && bun test tarball-consumer-fuzz.e2e.test.ts --timeout 600000

      - name: Run canonical browser contract suite
        if: ${{ matrix.suite == 'browser' }}
        # The runner owns the exact file list, keeps one Playwright/server suite
        # per Bun process, and fails if any contract executes zero positive tests.
        run: bun run test:browser

      - name: Verify website payload request graphs and budgets
        if: ${{ matrix.suite == 'browser' }}
        run: bun run website:payload:check --report head-site.json

      # Per-PR growth is judged against the base branch built on this runner with
      # this toolchain, not against a committed byte-exact baseline. Intended
      # growth is approved with the payload-growth-approved label, which covers
      # only the head it was applied to (scripts/ci/label-approval.ts).
      - name: Compare payload with the base branch
        if: ${{ matrix.suite == 'browser' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach ../payload-base "$BASE_SHA"
          (cd ../payload-base && bun install --frozen-lockfile && bun run build)
          bun run build
          bun run scripts/build/browser-lazy-report.ts --measure-only --json > head-lazy.json
          bun run scripts/build/browser-lazy-report.ts --root ../payload-base --measure-only --json > base-lazy.json
          bun run scripts/site/website-payload-report.ts --root ../payload-base --report base-site.json
          allow=()
          if bun run scripts/ci/label-approval.ts check --label payload-growth-approved; then allow=(--allow-growth); fi
          bun run scripts/ci/payload-delta.ts --base-lazy base-lazy.json --head-lazy head-lazy.json \
            --base-site base-site.json --head-site head-site.json "${allow[@]}"


  # One protectable result that cannot turn green before the downstream E2E
  # matrix and the red-green check finish. Repository rules should require this job.
  ci-complete:
    name: CI complete
    runs-on: ubuntu-latest
    needs: [test, e2e, red-green, expire-label-approvals]
    if: ${{ always() }}
    steps:
      - name: Require every CI lane to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          RED_GREEN_RESULT: ${{ needs.red-green.result }}
          EXPIRE_RESULT: ${{ needs.expire-label-approvals.result }}
        run: |
          # red-green runs only for pull requests, and label expiry only when a
          # push adds commits to one; other events skip them.
          if [[ "$TEST_RESULT" != "success" || "$E2E_RESULT" != "success" || ( "$RED_GREEN_RESULT" != "success" && "$RED_GREEN_RESULT" != "skipped" ) || ( "$EXPIRE_RESULT" != "success" && "$EXPIRE_RESULT" != "skipped" ) ]]; then
            echo "test=$TEST_RESULT e2e=$E2E_RESULT red-green=$RED_GREEN_RESULT expire-label-approvals=$EXPIRE_RESULT"
            exit 1
          fi
