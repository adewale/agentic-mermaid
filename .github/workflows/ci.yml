name: Join normalization review evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: 24aa671cb9a1508d062e8425062a372f3bd91637
      HEAD_SHA: 96071afa0fd4f4016d2cd7948ae86b547711a13b
      AGENTIC_MERMAID_ELK_CACHE: '0'
      AGENTIC_MERMAID_SCENE_ASSERTIONS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
          no-cache: true
      - name: Check immutable production revisions and unchanged dependency inputs
        run: |
          test "$(git rev-parse "$BASE_SHA^{commit}")" = "$BASE_SHA"
          test "$(git rev-parse "$HEAD_SHA^{commit}")" = "$HEAD_SHA"
          git diff --exit-code "$BASE_SHA" "$HEAD_SHA" -- package.json bun.lock
      - run: bun install --frozen-lockfile
      - name: Render the single same-input production fixture
        run: |
          bun run scripts/pr-assets/meaning-preservation-evidence.ts "$BASE_SHA" "$HEAD_SHA" bench-report/join-normalization flowchart-hierarchy-join-normalization
          for phase in before after; do
            test -s "bench-report/join-normalization/flowchart-hierarchy-join-normalization-$phase.svg"
            test -s "bench-report/join-normalization/flowchart-hierarchy-join-normalization-$phase.png"
            test -s "bench-report/join-normalization/flowchart-hierarchy-join-normalization-$phase-layout.json"
          done
          test -s bench-report/join-normalization/review.html
          test -s bench-report/join-normalization/terminal-review.html
      - name: Bind production sources, generator commit and rendered output bytes
        run: |
          jq -n --arg base "$BASE_SHA" --arg head "$HEAD_SHA" --arg generator "$GITHUB_SHA" --arg bun "$(bun --version)" '{baseSource: $base, headSource: $head, evidenceGeneratorCommit: $generator, bun: $bun, fixture: "flowchart-hierarchy-join-normalization", scope: "Join-only production SVG/PNG review evidence; main499 owns clipping/hard approach checks; no performance claim"}' > bench-report/join-normalization/source-pins.json
          cd bench-report/join-normalization
          sha256sum *.svg *.png *-layout.json *.html receipt.json > rendered-output-sha256.txt
      - name: Retain actual review outputs and provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cross-hierarchy-joins-96071afa0fd4f4016d2cd7948ae86b547711a13b
          path: bench-report/join-normalization/
          if-no-files-found: error
          retention-days: 30
