name: Route repair review evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: f8a2437b19e67a850145b786f72baf719da52837
      HEAD_SHA: b01b8e147aee1ee57ff0b5a7e5a3e9242f3d526d
      AGENTIC_MERMAID_ELK_CACHE: '0'
      AGENTIC_MERMAID_SCENE_ASSERTIONS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
          no-cache: true
      - name: Check immutable production revisions and unchanged dependency inputs
        run: |
          test "$(git rev-parse "$BASE_SHA^{commit}")" = "$BASE_SHA"
          test "$(git rev-parse "$HEAD_SHA^{commit}")" = "$HEAD_SHA"
          git diff --exit-code "$BASE_SHA" "$HEAD_SHA" -- package.json bun.lock
      - run: bun install --frozen-lockfile
      - name: Render the single same-input production fixture
        run: |
          bun run scripts/pr-assets/meaning-preservation-evidence.ts "$BASE_SHA" "$HEAD_SHA" bench-report/route-repair flowchart-hierarchy-endpoint-repair
          for phase in before after; do
            test -s "bench-report/route-repair/flowchart-hierarchy-endpoint-repair-$phase.svg"
            test -s "bench-report/route-repair/flowchart-hierarchy-endpoint-repair-$phase.png"
            test -s "bench-report/route-repair/flowchart-hierarchy-endpoint-repair-$phase-layout.json"
          done
      - name: Bind production sources, generator commit and rendered output bytes
        run: |
          jq -n --arg base "$BASE_SHA" --arg head "$HEAD_SHA" --arg generator "$GITHUB_SHA" --arg bun "$(bun --version)" '{baseSource: $base, headSource: $head, evidenceGeneratorCommit: $generator, bun: $bun, fixture: "flowchart-hierarchy-endpoint-repair", scope: "Production SVG/PNG review evidence and debug layout sidecars; no performance claim"}' > bench-report/route-repair/source-pins.json
          cd bench-report/route-repair
          sha256sum *.svg *.png *-layout.json index.html receipt.json > rendered-output-sha256.txt
      - name: Retain actual review outputs and provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cross-hierarchy-endpoints-b01b8e147aee1ee57ff0b5a7e5a3e9242f3d526d
          path: bench-report/route-repair/
          if-no-files-found: error
          retention-days: 30
