name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic:
    name: Independent semantic conformance
    permissions:
      contents: read
    uses: ./.github/workflows/modern-mermaid.yml

  unit:
    name: Unit tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Keep runaway tests and runner teardown bounded.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the CJK coverage fixture
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei

      - name: Build the Node bundle for cross-runtime determinism contracts
        run: bunx --no-install tsup

      # Materialize the shared fixture before isolated test workers start.
      # A stalled cold build inside one worker otherwise strands lock waiters.
      - name: Prepare website fixtures before parallel tests
        timeout-minutes: 2
        run: bun -e 'import { ensureWebsiteBuilt } from "./src/__tests__/website-public-fixture.ts"; ensureWebsiteBuilt()'

      # Coverage is a scheduled diagnostic, not a condition for passing tests.
      # Keep two isolated workers: subprocess-heavy suites contend at four.
      - name: Run test shard
        run: bun run test -- --shard=${{ matrix.shard }} --parallel=2

  layout-evidence:
    name: Layout backend review evidence
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Prepare the immutable base for layout review
        if: github.event_name == 'pull_request'
        env:
          LAYOUT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          layout_base="$RUNNER_TEMP/layout-review-base"
          git fetch --no-tags --depth=1 origin "$LAYOUT_BASE_SHA"
          git worktree add --detach "$layout_base" "$LAYOUT_BASE_SHA"
          if cmp -s bun.lock "$layout_base/bun.lock"; then
            ln -s "$GITHUB_WORKSPACE/node_modules" "$layout_base/node_modules"
          else
            (cd "$layout_base" && bun install --frozen-lockfile)
          fi
          echo "LAYOUT_BASE_ROOT=$layout_base" >> "$GITHUB_ENV"
      - name: Render graph backend comparison
        env:
          LAYOUT_REVIEW: ${{ runner.temp }}/layout-backends
        run: |
          mkdir -p "$LAYOUT_REVIEW"
          bun -e '
            import { renderMermaidPNGWithReceipt, renderMermaidSVGWithReceipt } from "./src/agent/index.ts";
            import { flowchartTree } from "./eval/shared/graph-fixtures.ts";
            import { collectSamples } from "./eval/layout-compare/run.ts";
            import { generatedFlowchartSamples } from "./eval/layout-compare/generated.ts";
            const fixtures = [
              ["fan-in-fan-out", await Bun.file("eval/layout-compare/fixtures/fan-in-fan-out.mmd").text()],
              ["nested-wide-titles", await Bun.file("eval/layout-compare/fixtures/nested-wide-titles.mmd").text()],
              ["cyclic-labelled-11", await Bun.file("eval/layout-compare/fixtures/cyclic-labelled-11.mmd").text()],
              ["cyclic-labelled-10", await Bun.file("eval/layout-compare/fixtures/cyclic-labelled-10.mmd").text()],
              ["cyclic-labelled-15", await Bun.file("eval/layout-compare/fixtures/cyclic-labelled-15.mmd").text()],
              ["cyclic-labelled-19", await Bun.file("eval/layout-compare/fixtures/cyclic-labelled-19.mmd").text()],
              ["cyclic-labelled-9", await Bun.file("eval/layout-compare/fixtures/cyclic-labelled-9.mmd").text()],
              ["cyclic-labelled-13", await Bun.file("eval/layout-compare/fixtures/cyclic-labelled-13.mmd").text()],
              ["cyclic-labelled-9-chains", await Bun.file("eval/layout-compare/fixtures/cyclic-labelled-9-chains.mmd").text()],
              ["cyclic-labelled-15-chains", await Bun.file("eval/layout-compare/fixtures/cyclic-labelled-15-chains.mmd").text()],
              ["cyclic-labelled-18-cuts", await Bun.file("eval/layout-compare/fixtures/cyclic-labelled-18-cuts.mmd").text()],
              ["architecture-backends", await Bun.file("eval/layout-compare/fixtures/architecture-backends.mmd").text()],
              ["class-backends", await Bun.file("eval/layout-compare/fixtures/class-backends.mmd").text()],
              ["class-compound-backends", await Bun.file("eval/layout-compare/fixtures/class-compound-backends.mmd").text()],
              ["er-backends", await Bun.file("eval/layout-compare/fixtures/er-backends.mmd").text()],
              ["er-compound-backends", await Bun.file("eval/layout-compare/fixtures/er-compound-backends.mmd").text()],
              ["requirement-backends", await Bun.file("eval/layout-compare/fixtures/requirement-backends.mmd").text()],
              ["tree-300", flowchartTree(300)],
              ["parallel-label-corridor", "flowchart BT\nn0 --> n6\nn0 -->|edge 4 xxxxxxx| n2\nn0 --> n6"],
            ];
            const directory = process.env.LAYOUT_REVIEW;
            for (const [name, source] of fixtures) for (const backend of ["elk", "agentic"]) {
              const options = { graphLayout: { backend }, security: "strict" };
              const pngOptions = { ...options, ...(name === "tree-300" ? { fitTo: { width: 1600 } } : {}) };
              const rendered = renderMermaidPNGWithReceipt(source, pngOptions);
              const vector = renderMermaidSVGWithReceipt(source, options);
              await Bun.write(`${directory}/${name}-${backend}.svg`, vector.svg);
              await Bun.write(`${directory}/${name}-${backend}.png`, rendered.png);
              await Bun.write(`${directory}/${name}-${backend}.json`, JSON.stringify({ source, options: pngOptions, receipt: rendered.receipt, svgOptions: options, svgReceipt: vector.receipt, review: name === "tree-300" ? "PNG is an overview; zoom the full SVG for leaf labels and route crossings." : "Inspect labels, arrows and route clearance." }, null, 2));
            }
            const samples = collectSamples({ includeStress: true });
            const advisory = [
              { name: "class-inheritance", source: samples.find(s => s.id === "corpus/class/0")?.source },
              { name: "er-tree", source: samples.find(s => s.id === "fixture/stress/er-40-entities.mmd")?.source },
              { name: "parallel-labels", source: generatedFlowchartSamples({ start: 40, count: 1 })[0].source },
            ];
            if (advisory.some(s => !s.source)) throw new Error("Missing layout advisory review input");
            // Each revision gets its own process and module/registry identities.
            // Inputs are fixed by the candidate, then replayed unchanged at base.
            const probe = `
              const { renderMermaidPNGWithReceipt, renderMermaidSVGWithReceipt, layoutMermaidWithReceipt, measureQuality } = await import(process.cwd() + "/src/agent/index.ts");
              const revision = new TextDecoder().decode(Bun.spawnSync(["git", "rev-parse", "HEAD"]).stdout).trim();
              for (const { name, source } of JSON.parse(process.env.LAYOUT_REVIEW_INPUTS)) for (const backend of ["elk", "agentic"]) {
                const label = process.env.LAYOUT_REVIEW_LABEL;
                const path = process.env.LAYOUT_REVIEW + "/advisory-" + name + "-" + label + "-" + backend;
                const options = { graphLayout: { backend }, security: "strict" };
                try {
                  const svg = renderMermaidSVGWithReceipt(source, options);
                  const png = renderMermaidPNGWithReceipt(source, { ...options, fitTo: { width: 1000 } });
                  const layout = layoutMermaidWithReceipt(source, options);
                  await Bun.write(path + ".svg", svg.svg);
                  await Bun.write(path + ".png", png.png);
                  await Bun.write(path + ".json", JSON.stringify({ revision, label, source, options, metrics: measureQuality(layout.layout), receipt: svg.receipt, review: "Compare labels, endpoint markers and crossings. PNG is an overview; zoom the full SVG for the ER tree." }, null, 2));
                } catch (error) {
                  await Bun.write(path + ".json", JSON.stringify({ revision, label, source, options, error: String(error), review: "This revision could not render the input; no baseline image was fabricated." }, null, 2));
                  if (label === "after") throw error;
                }
              }
            `;
            for (const [label, root] of [["before", process.env.LAYOUT_BASE_ROOT], ["after", process.cwd()]]) {
              if (!root) continue;
              const child = Bun.spawnSync(["bun", "-e", probe], { cwd: root, stdout: "inherit", stderr: "inherit", env: { ...process.env, LAYOUT_REVIEW_INPUTS: JSON.stringify(advisory), LAYOUT_REVIEW_LABEL: label } });
              if (child.exitCode !== 0) throw new Error("Layout advisory review failed: " + label);
            }
          '
      - name: Render source-preserving edit review
        env:
          LAYOUT_REVIEW: ${{ runner.temp }}/layout-backends
        run: |
          bun -e '
            const inputs = [
              { name: "source-class-member", source: "classDiagram\nnamespace `~T~A::B` {\n  class A {\n    +old\n  }\n}\n", op: { kind: "add_member", class: "A", text: "+reviewed" } },
              { name: "source-flow-label", source: "flowchart TD\n  A[Old] --> B\n  classDef retained border:1px s:::colid red\n", op: { kind: "set_label", target: "A", label: "Reviewed" } },
            ];
            const probe = `
              const api = await import(process.cwd() + "/src/agent/index.ts");
              const revision = new TextDecoder().decode(Bun.spawnSync(["git", "rev-parse", "HEAD"]).stdout).trim();
              for (const input of JSON.parse(process.env.SOURCE_REVIEW_INPUTS)) {
                const label = process.env.LAYOUT_REVIEW_LABEL;
                const path = process.env.LAYOUT_REVIEW + "/" + input.name + "-" + label;
                const parsed = api.parseRegisteredMermaid(input.source);
                const edited = typeof api.mutatePreservingSource === "function" && parsed.ok
                  ? api.mutatePreservingSource(parsed.value, input.op) : undefined;
                const source = edited?.ok ? edited.value.source : input.source;
                const options = { security: "strict" };
                const vector = api.renderMermaidSVGWithReceipt(source, options);
                const raster = api.renderMermaidPNGWithReceipt(source, options);
                await Bun.write(path + ".svg", vector.svg);
                await Bun.write(path + ".png", raster.png);
                await Bun.write(path + ".json", JSON.stringify({ revision, label, input, source, options,
                  edit: edited ?? { ok: false, error: "Source-preserving API unavailable at this revision; image shows original source." },
                  receipt: vector.receipt, review: "Inspect the added reviewed member or Reviewed label; namespace, old member, endpoint and retained style must survive." }, null, 2));
                if (label === "after" && !edited?.ok) throw new Error("Source edit review failed: " + input.name);
              }
            `;
            for (const [label, root] of [["before", process.env.LAYOUT_BASE_ROOT], ["after", process.cwd()]]) {
              if (!root) continue;
              const child = Bun.spawnSync(["bun", "-e", probe], { cwd: root, stdout: "inherit", stderr: "inherit",
                env: { ...process.env, SOURCE_REVIEW_INPUTS: JSON.stringify(inputs), LAYOUT_REVIEW_LABEL: label } });
              if (child.exitCode !== 0) throw new Error("Source edit review failed: " + label);
            }
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: layout-backends-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/layout-backends/
          retention-days: 14

  layout-quality-evidence:
    name: Generated layout diagnostic (advisory)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Record every generated input and backend outcome
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/generated-layouts
        run: |
          mkdir -p "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR/corpus"
          for backend in elk agentic; do
            bun run eval/layout-compare/run.ts snapshot --graph-layout "$backend" \
              --families flowchart,state,class,er,requirement,architecture --stress --label "$backend" \
              --out "$EVIDENCE_DIR/corpus/$backend.json"
          done
          for start in 0 256 320; do
            count=256
            directory="$EVIDENCE_DIR"
            if [ "$start" = 256 ]; then
              count=64
              directory="$EVIDENCE_DIR/development-256-319"
            elif [ "$start" = 320 ]; then
              count=64
              directory="$EVIDENCE_DIR/development-320-383"
            fi
            mkdir -p "$directory"
            for backend in elk agentic; do
              bun run eval/layout-compare/run.ts snapshot --graph-layout "$backend" \
                --generated-start "$start" --generated-count "$count" --label "$backend" \
                --out "$directory/$backend.json"
            done
          done
          for start in 0 64 128 192; do
            end=$((start + 63))
            directory="$EVIDENCE_DIR/independent-sha256-counter-v1-$start-$end"
            mkdir -p "$directory"
            for backend in elk agentic; do
              bun run eval/layout-compare/run.ts snapshot --graph-layout "$backend" \
                --generated-kind sha256-counter-v1 --generated-start "$start" --generated-count 64 --label "$backend" \
                --out "$directory/$backend.json"
            done
          done
          for cache in off normal; do
            cache_flag=0
            features=text-spans
            if [ "$cache" = normal ]; then
              cache_flag=1
              features=text-spans,position-cache
            fi
            AGENTIC_MERMAID_ELK_CACHE="$cache_flag" AGENTIC_MERMAID_EXPERIMENTS="$features" \
              bun run eval/layout-compare/edit-run.ts --out "$EVIDENCE_DIR/edits-$cache.json"
          done
      - name: Compare final quality without declaring a performance winner
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/generated-layouts
        run: |
          failed=0
          for directory in "$EVIDENCE_DIR/corpus" "$EVIDENCE_DIR" "$EVIDENCE_DIR/development-256-319" "$EVIDENCE_DIR/development-320-383" "$EVIDENCE_DIR/independent-sha256-counter-v1-0-63" "$EVIDENCE_DIR/independent-sha256-counter-v1-64-127" "$EVIDENCE_DIR/independent-sha256-counter-v1-128-191" "$EVIDENCE_DIR/independent-sha256-counter-v1-192-255"; do
            # Both are supported first-party producers. A baseline failure must
            # remain a finding even when the other backend improves support.
            if ! bun -e 'let failed = false; for (const path of process.argv.slice(1)) { const snapshot = await Bun.file(path).json(); for (const sample of snapshot.samples) if (!sample.ok) { console.error(path + ": " + sample.id + ": " + sample.error); failed = true; } } if (failed) process.exit(1);' \
              "$directory/elk.json" "$directory/agentic.json"; then
              failed=1
            fi
            if ! bun run eval/layout-compare/run.ts report --before "$directory/elk.json" \
              --after "$directory/agentic.json" --out "$directory/report.html"; then
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: generated-layouts-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/generated-layouts/
          retention-days: 14

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true

      # This is the same aggregate developers run locally. It installs the
      # frozen dependency graph, runs every QUALITY_CHECKS gate in
      # scripts/ci/quality-gates.ts, and reports all failures in one pass.
      - name: Run the complete local and CI quality suite
        run: bun run quality:check


  mcp-conformance:
    name: MCP conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Setup Node for the official conformance CLI
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run pinned official MCP conformance scenarios
        run: bun run eval:mcp-conformance

  # CLAUDE.md good-pr dimension 4, checked mechanically: when a PR changes
  # production code and tests, a changed test must produce an assertion failure
  # attributed to a test location against base production (not merely a failing
  # process). Assertion meaning still needs review. Pure refactors opt out with the
  # `no-red-green` label, which approves only the head it was applied to
  # (scripts/ci/label-approval.ts); re-running the job after labelling works.
  red-green:
    name: Changed tests fail on the base branch
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the CJK coverage fixture
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei

      - name: Resolve tested PR revisions
        id: pr-revisions
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun run scripts/ci/pr-merge-revisions.ts "$PR_HEAD_SHA"

      - name: Run changed tests against the base branch's production code
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ steps.pr-revisions.outputs.base }}
        run: |
          if bun run scripts/ci/label-approval.ts check --label no-red-green; then
            echo "Skipped: no-red-green approves this head."
            exit 0
          fi
          bun run scripts/ci/red-green.ts --base "$BASE_SHA"

  # A label approval covers the head it was applied to. When new commits
  # arrive, remove the approval labels applied before them, as GitHub dismisses
  # stale reviews. The checks that read the labels apply the same rule, so they
  # ignore a stale label even if they read it before this job removes it.
  expire-label-approvals:
    name: Expire label approvals of earlier heads
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Remove approval labels applied to an earlier head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
        run: bun run scripts/ci/label-approval.ts expire

  # Preserve the existing required check name while the work behind it runs in
  # parallel. always() turns a failed or cancelled prerequisite into a failed
  # aggregate gate instead of a misleading skipped check.
  test:
    runs-on: ubuntu-latest
    needs: [unit, quality, mcp-conformance]
    if: ${{ always() }}
    timeout-minutes: 10

    steps:
      - name: Require every test lane to pass
        if: ${{ always() }}
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          MCP_CONFORMANCE_RESULT: ${{ needs['mcp-conformance'].result }}
        run: |
          if [[ "$UNIT_RESULT" != "success" || "$QUALITY_RESULT" != "success" || "$MCP_CONFORMANCE_RESULT" != "success" ]]; then
            echo "unit=$UNIT_RESULT quality=$QUALITY_RESULT mcp-conformance=$MCP_CONFORMANCE_RESULT"
            exit 1
          fi

  e2e:
    name: E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    # These suites construct their own inputs; no unit/quality dependency.
    # Browser binaries and OS libraries are one versioned environment. Avoid
    # re-provisioning three engines from an Ubuntu mirror on every CI run.
    container:
      image: ${{ contains(fromJSON('["browser","browser-site","payload"]'), matrix.suite) && 'mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0' || '' }}
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        suite: [cli, dist-artifact, tarball-consumer, tarball-consumer-node22, browser, browser-site, payload]

    steps:
      - uses: actions/checkout@v7

      - name: Align the browser container session with its user
        if: ${{ matrix.suite == 'browser' || matrix.suite == 'browser-site' || matrix.suite == 'payload' }}
        # GitHub mounts a host-owned home. Firefox requires its owner to match
        # the container user; Git also needs this exact checkout trusted.
        run: |
          chown "$(id -u):$(id -g)" "$HOME"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install the editor's requested monospace font
        if: ${{ matrix.suite == 'browser' || matrix.suite == 'browser-site' || matrix.suite == 'payload' }}
        # The stock image lacks DejaVu Sans Mono, which the editor requests.
        # Keep font metrics consistent with the Ubuntu host browser contract.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fonts-dejavu-core=2.37-8

      - name: Install Bun in the browser environment
        if: ${{ matrix.suite == 'browser' || matrix.suite == 'browser-site' || matrix.suite == 'payload' }}
        # The image has Node/npm but no unzip, which setup-bun requires.
        run: |
          npm install --global bun@1.4.2
          test "$(bun --version)" = "1.4.2"

      - name: Install GitHub CLI for payload label checks
        if: ${{ matrix.suite == 'payload' && github.event_name == 'pull_request' }}
        run: apt-get install -y --no-install-recommends gh

      - name: Setup Bun
        if: ${{ matrix.suite != 'browser' && matrix.suite != 'browser-site' && matrix.suite != 'payload' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Setup Node for shipped-artifact gates
        if: ${{ matrix.suite == 'dist-artifact' || matrix.suite == 'tarball-consumer' || matrix.suite == 'tarball-consumer-node22' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.suite == 'tarball-consumer-node22' && '22' || '24' }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install GitHub CLI for head-bound payload approvals
        if: ${{ matrix.suite == 'payload' && github.event_name == 'pull_request' }}
        run: apt-get update && apt-get install -y gh

      - name: Check the Playwright environment matches the installed package
        if: ${{ matrix.suite == 'browser' || matrix.suite == 'browser-site' || matrix.suite == 'payload' }}
        run: |
          bun -e 'const {version}=require("playwright/package.json"); if(version!=="1.58.2") throw new Error(`Update the pinned Playwright CI image for package ${version}`)'
          bunx playwright install --list

      - name: Resolve tested PR revisions
        if: ${{ matrix.suite == 'payload' && github.event_name == 'pull_request' }}
        id: pr-revisions
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun run scripts/ci/pr-merge-revisions.ts "$PR_HEAD_SHA"

      - name: Render affected label and category witnesses before and after
        if: ${{ matrix.suite == 'payload' && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ steps.pr-revisions.outputs.base }}
          HEAD_SHA: ${{ steps.pr-revisions.outputs.head }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- scripts/pr-assets/meaning-preservation-evidence.ts src/layout-engine.ts src/layout src/layout-rubric.ts src/route-contracts.ts src/shape-clipping.ts src/shape-outline.ts src/class src/pie src/journey src/gitgraph src/radar src/xychart src/sequence src/architecture src/ishikawa src/sankey src/agent/families-builtin.ts src/svg-family-hooks/flowchart.ts src/parser.ts src/state src/er src/ascii src/block; then
            exit 0
          fi
          bun run scripts/pr-assets/meaning-preservation-evidence.ts "$BASE_SHA" "$HEAD_SHA" bench-report/meaning-preservation compat-er-attribute-quotes compat-corpus-flowchart-94 compat-corpus-flowchart-95 compat-corpus-flowchart-96 compat-corpus-state-0 compat-corpus-state-1 compat-corpus-state-8 compat-corpus-state-14 compat-corpus-state-16 compat-corpus-state-17 compat-corpus-state-18 compat-corpus-state-19 compat-flowchart-membership compat-c4-named-label compat-state-floating-note compat-er-parent compat-sequence-wrap agent-flat-namespace agent-category-role agent-journey-visibility journey-literal-formatted-identity agent-gitgraph-rails agent-small-values compat-flowchart-block-label compat-sequence-spaced-metadata compat-class-identifiers compat-architecture-compact-edge compat-gitgraph-repeated-pick compat-ellipse compat-parallel-overlay compat-architecture-text-icon nightly-architecture-card-clearance terminal-block-protected-approaches terminal-state-distinct-contacts terminal-local-bundle terminal-local-labeled-trunk terminal-state-declaration-timing terminal-approach-envelopes flowchart-feedback-outward-contact compat-corpus-flowchart-98 native-priority-aj native-priority-an flowchart-cosmetic-circle-approach flowchart-peer-label-capacity flowchart-mixed-parallel-feedback rayner-xy-title-income-30000 rayner-xy-title-income-65673.88 rayner-xy-title-income-150000 rayner-architecture-local-pods-1-1-1 rayner-architecture-local-pods-2-2-0 architecture-alignment-components grammar-ishikawa-header grammar-sankey-repeated-header class-elk-authored-prefix class-elk-compound-collision class-elk-quoted-ancestry class-elk-empty-content class-elk-notes-only terminal-class-notes-only native-eventmodeling flowchart-curved-port-diagonal flowchart-grouped-wide-captions flowchart-thick-terminal-shaft flowchart-invisible-join flowchart-lineage-default flowchart-lineage-publication flowchart-98-publication

      - name: Render bounded chart fitting witnesses
        if: ${{ matrix.suite == 'payload' && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ steps.pr-revisions.outputs.base }}
          HEAD_SHA: ${{ steps.pr-revisions.outputs.head }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- src/pie src/radar src/shared/chart-width.ts src/shared/text-rows.ts src/editor-render-options.ts; then
            exit 0
          fi
          bun run scripts/pr-assets/meaning-preservation-evidence.ts "$BASE_SHA" "$HEAD_SHA" bench-report/meaning-preservation/charts chart-fit-pie-long-default chart-fit-pie-long-excalidraw chart-fit-pie-palette-default chart-fit-pie-palette-excalidraw chart-fit-radar-restaurants-default chart-fit-radar-restaurants-excalidraw chart-fit-radar-grades-default chart-fit-radar-grades-excalidraw chart-fit-radar-long-axes-default chart-fit-radar-long-axes-excalidraw

      - name: Capture native ZenUML Looks and configured browser controls
        if: ${{ matrix.suite == 'payload' && github.event_name == 'pull_request' }}
        run: |
          bun run build
          bun run scripts/pr-assets/zenuml-evidence.ts bench-report/meaning-preservation/zenuml

      - name: Retain diagram review images
        if: ${{ matrix.suite == 'payload' && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: meaning-preservation-${{ github.event.pull_request.head.sha }}
          path: bench-report/meaning-preservation/
          if-no-files-found: ignore
          retention-days: 30

      - name: Run CLI E2E tests
        if: ${{ matrix.suite == 'cli' }}
        run: cd e2e && bun test cli-smoke.e2e.test.ts cli.e2e.test.ts fresh-checkout.e2e.test.ts --timeout 120000

      - name: Run single-binary E2E tests
        if: ${{ matrix.suite == 'cli' }}
        run: cd e2e && bun test single-binary.e2e.test.ts --timeout 180000

      - name: Verify built artifacts and bundler compatibility
        if: ${{ matrix.suite == 'dist-artifact' }}
        # Keep distinct browser/Node bundler and deferred-ELK contracts here.
        # Source/Node differential fuzz and PNG parity run against the installed tarball.
        run: cd e2e && bun test dist-artifact.e2e.test.ts --timeout 400000

      - name: Install the pinned publishing npm for manifest verification
        if: ${{ matrix.suite == 'tarball-consumer' }}
        run: |
          npm install -g npm@11.18.0 --ignore-scripts
          test "$(npm --version)" = "11.18.0"

      - name: Run tarball consumer and Getting Started commands under Node
        if: ${{ matrix.suite == 'tarball-consumer' || matrix.suite == 'tarball-consumer-node22' }}
        # Packs, installs into a clean project, and fuzzes the installed library
        # + `am`/`agentic-mermaid-mcp` bins as spawned Node processes — the real
        # consumer path (exports resolution, files[], bin linking, native deps).
        # Executes the Getting Started shell blocks and pinned MCP config from
        # the built page and library guide against that same tarball.
        run: cd e2e && bun test tarball-consumer-fuzz.e2e.test.ts --timeout 600000

      - name: Verify the reviewed npm package file manifest
        if: ${{ matrix.suite == 'tarball-consumer' }}
        run: bun run scripts/ci/verify-publish-package.ts --pack-destination ci-release-artifact

      - name: Reject a divergent already-published immutable npm version
        if: ${{ matrix.suite == 'tarball-consumer' }}
        run: bun run scripts/ci/published-version.ts

      # The file manifest proves which files ship; publint and attw prove the
      # shipped exports resolve and carry types for Node ESM and bundlers.
      - name: Lint the packed package's exports and types
        if: ${{ matrix.suite == 'tarball-consumer' }}
        run: bun run lint:package

      - name: Run canonical browser contract shard
        if: ${{ matrix.suite == 'browser' || matrix.suite == 'browser-site' }}
        # One Playwright/server suite per process, with disjoint file shards.
        env:
          AM_EDITOR_BUILD_METAFILE: ${{ matrix.suite == 'browser' && format('{0}/standalone-editor-metafile.json', runner.temp) || '' }}
        run: bun run test:browser --shard=${{ matrix.suite == 'browser' && '1/2' || '2/2' }}

      - name: Compare resolved scenes with Chromium
        if: ${{ matrix.suite == 'browser' }}
        # Read pinned Rayner snapshot specs as data; do not execute its code.
        run: |
          mkdir -p bench-report/resolved-scene
          bun run build:browser
          bun scripts/resolved-scene-corpus.ts families /tmp/resolved-families.json
          bun scripts/resolved-scene-oracle.ts /tmp/resolved-families.json --compare --worker-bundle dist/browser.global.js | tee bench-report/resolved-scene/families.log
          rayner_checkout=$(mktemp -d)
          git -C "$rayner_checkout" init --quiet
          git -C "$rayner_checkout" remote add origin https://github.com/adewale/rayner.git
          git -C "$rayner_checkout" fetch --quiet --depth=1 origin bd6f4d980f68d1a0b59f5f17fd16c5b955e9f824
          git -C "$rayner_checkout" checkout --quiet --detach FETCH_HEAD
          bun scripts/resolved-scene-corpus.ts rayner "$rayner_checkout" /tmp/resolved-rayner.json
          bun scripts/resolved-scene-oracle.ts /tmp/resolved-rayner.json --compare --self-test | tee bench-report/resolved-scene/rayner.log

      - name: Retain resolved-scene comparisons
        if: ${{ always() && matrix.suite == 'browser' }}
        uses: actions/upload-artifact@v7
        with:
          name: resolved-scene-${{ github.event.pull_request.head.sha || github.sha }}
          path: bench-report/resolved-scene/
          retention-days: 30
          if-no-files-found: warn

      - name: Retain Editor interaction review images
        if: ${{ always() && matrix.suite == 'browser' }}
        uses: actions/upload-artifact@v7
        with:
          name: editor-community-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: e2e/screenshots/current-*.png
          retention-days: 7
          if-no-files-found: warn

      - name: Retain standalone editor module graph and byte counts
        if: ${{ always() && matrix.suite == 'browser' }}
        uses: actions/upload-artifact@v7
        with:
          name: standalone-editor-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/standalone-editor-metafile.json
          retention-days: 7
          if-no-files-found: warn

      - name: Verify website payload request graphs and budgets
        if: ${{ matrix.suite == 'payload' }}
        # This builds the site and its lazy bundle once, then captures requests.
        run: bun run website:payload:check --report head-site.json

      # Per-PR growth is judged against the base branch built on this runner with
      # this toolchain, not against a committed byte-exact baseline. Intended
      # growth is approved with the payload-growth-approved label, which covers
      # only the head it was applied to (scripts/ci/label-approval.ts).
      - name: Compare payload with the base branch
        if: ${{ !cancelled() && matrix.suite == 'payload' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ steps.pr-revisions.outputs.base }}
        run: |
          # The absolute check writes this report before checking its ceilings.
          # Keep the relative diagnosis when those ceilings are already failing.
          test -s head-site.json
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach ../payload-base "$BASE_SHA"
          # Build the base with the Bun the base pins, so a PR that upgrades Bun
          # shows the upgrade's effect instead of building both sides with it.
          base_bun_bin=$(bun run scripts/ci/base-bun.ts --base ../payload-base)
          base_path="${base_bun_bin:+$base_bun_bin:}$PATH"
          head_bun=$(command -v bun)
          (cd ../payload-base && PATH="$base_path" bun install --frozen-lockfile)
          bun run scripts/build/browser-lazy-report.ts --measure-only --json > head-lazy.json
          cp dist/metafile-esm.json head-lazy-metafile.json
          PATH="$base_path" "$head_bun" run scripts/site/website-payload-report.ts --root ../payload-base --report base-site.json
          bun run scripts/build/browser-lazy-report.ts --root ../payload-base --measure-only --json > base-lazy.json
          cp ../payload-base/dist/metafile-esm.json base-lazy-metafile.json
          allow=()
          if bun run scripts/ci/label-approval.ts check --label payload-growth-approved; then allow=(--allow-growth); fi
          bun run scripts/ci/payload-delta.ts --base-lazy base-lazy.json --head-lazy head-lazy.json \
            --base-site base-site.json --head-site head-site.json "${allow[@]}"

      - name: Retain payload reports and module graphs
        if: ${{ always() && matrix.suite == 'payload' }}
        uses: actions/upload-artifact@v7
        with:
          name: payload-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            head-site.json
            head-lazy.json
            head-lazy-metafile.json
            base-site.json
            base-lazy.json
            base-lazy-metafile.json
            dist/metafile-esm.json
          retention-days: 7
          if-no-files-found: warn


  # One protectable result that cannot turn green before the downstream E2E
  # matrix and the red-green check finish. Repository rules should require this job.
  ci-complete:
    name: CI complete
    runs-on: ubuntu-latest
    needs: [test, e2e, red-green, expire-label-approvals, semantic, consumer-quickstarts]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Require every CI lane to pass
        env:
          SEMANTIC_RESULT: ${{ needs.semantic.result }}
          CONSUMER_RESULT: ${{ needs.consumer-quickstarts.result }}
          TEST_RESULT: ${{ needs.test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          RED_GREEN_RESULT: ${{ needs.red-green.result }}
          EXPIRE_RESULT: ${{ needs.expire-label-approvals.result }}
        run: |
          # red-green runs only for pull requests, and label expiry only when a
          # push adds commits to one; other events skip them.
          if [[ "$CONSUMER_RESULT" != "success" || "$SEMANTIC_RESULT" != "success" || "$TEST_RESULT" != "success" || "$E2E_RESULT" != "success" || ( "$RED_GREEN_RESULT" != "success" && "$RED_GREEN_RESULT" != "skipped" ) || ( "$EXPIRE_RESULT" != "success" && "$EXPIRE_RESULT" != "skipped" ) ]]; then
            echo "consumer=$CONSUMER_RESULT semantic=$SEMANTIC_RESULT test=$TEST_RESULT e2e=$E2E_RESULT red-green=$RED_GREEN_RESULT expire-label-approvals=$EXPIRE_RESULT"
            exit 1
          fi

  consumer-quickstarts:
    name: Installed-package quickstarts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node scripts/ci/installed-quickstarts.mjs
