name: Nightly finder

# Randomness belongs in finder lanes, not in the PR gate (docs/testing-strategy.md,
# "Seed policy: pinned gates, rolling finders"). Every property suite rolls fresh
# fast-check seeds with a raised minimum run count. A failure never blocks a pull
# request; it files (or comments on) one issue with the seed and counterexample so
# it can be fixed and kept as a permanent fast-check `examples` entry. The
# grammar lane retains disagreements as evidence and files finite reports of
# demonstrated export/round-trip failures after reviewed-corpus triage.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-finder
  cancel-in-progress: false

jobs:
  execution-order:
    name: Test execution finder (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [shuffled, fresh-process]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true
      - name: Install dependencies and native test prerequisites
        run: |
          bun install --frozen-lockfile
          sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
          bunx --no-install tsup
      - name: Search execution-order and process-state failures
        env:
          FINDER_MODE: ${{ matrix.mode }}
        run: |
          set -o pipefail
          bun run scripts/ci/find-test-order.ts "$FINDER_MODE" 2>&1 | tee execution-order.log
      - name: Retain replay seeds and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: execution-order-${{ matrix.mode }}
          path: execution-order.log
          retention-days: 7
          if-no-files-found: warn

  random-seed-properties:
    name: Random-seed property sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Roll fresh seeds across every fast-check suite
        id: sweep
        env:
          AM_FC_SEED: random
          AM_FC_NUM_RUNS: '300'
          FORCE_COLOR: '0'
        run: |
          set -o pipefail
          mapfile -t files < <(git grep -l "from 'fast-check'" -- 'src/__tests__/*.test.ts')
          echo "Sweeping ${#files[@]} property files"
          bun test --timeout 120000 "${files[@]}" 2>&1 | tee sweep.log

      - name: File or update the finder issue
        if: ${{ failure() && steps.sweep.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bun run scripts/ci/nightly-finder-report.ts sweep.log /dev/null finder-report.json > finder-body.md
          title=$(bun -e "import { FINDER_ISSUE_TITLE } from './scripts/ci/nightly-finder-report.ts'; console.log(FINDER_ISSUE_TITLE)")
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          : > prior.md
          if [ -n "$existing" ]; then
            gh issue view "$existing" --json body,comments --jq '.body, .comments[].body' > prior.md
          fi
          bun run scripts/ci/nightly-finder-report.ts sweep.log prior.md finder-report.json > finder-body.md
          if [ ! -s finder-body.md ]; then
            echo 'No failing property the collector does not already list.'
            exit 0
          fi
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file finder-body.md
          else
            gh issue create --title "$title" --body-file finder-body.md
          fi

      - name: Retain complete property counterexamples
        if: ${{ always() && steps.sweep.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: property-finder-evidence
          path: |
            sweep.log
            finder-report.json
          retention-days: 30
          if-no-files-found: warn

      # A finder that cannot run searches nothing while its schedule looks
      # alive: a failed checkout or install, or a timeout, used to leave only a
      # red scheduled run, which is how 26 scheduled mutation runs failed
      # unnoticed. Report it as an issue too; this step needs no checkout.
      - name: Report a sweep that did not run to completion
        if: ${{ always() && steps.sweep.outcome != 'success' && steps.sweep.outcome != 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SWEEP_OUTCOME: ${{ steps.sweep.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Nightly finder: the random-seed sweep did not run to completion'
          body="The random-seed property sweep ended as \`${SWEEP_OUTCOME:-not started}\` (\`skipped\` means an earlier step failed; \`cancelled\` usually means the 60-minute timeout), so it searched nothing. Run: $RUN_URL"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  # The Mermaid grammar comparison keeps seed 7 in the PR gate and the weekly
  # deep run (modern-mermaid.yml). This lane draws a fresh seed each night for
  # the families ours parses natively. Retained disagreements and the reviewed
  # corpus go through contract triage before any product issue is filed.
  rolling-seed-grammar:
    name: Rolling-seed Mermaid grammar finder
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Setup Node for the reference parser
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the independent pinned reference
        env:
          MERMAID_UPSTREAM_DIR: ${{ runner.temp }}/mermaid
          MERMAID_REFERENCE_DIR: ${{ runner.temp }}/mermaid-reference
        run: bash scripts/setup-mermaid-reference.sh

      # The weekly seed-7 run compares 5,000 mutations of all 32 families in
      # about ten minutes; 15,000 of the 17 native families leaves room within
      # the step timeout for verify and the reductions.
      - name: Search a fresh seed for silent reads
        id: search
        timeout-minutes: 75
        env:
          MERMAID_UPSTREAM_DIR: ${{ runner.temp }}/mermaid
          MERMAID_REFERENCE_DIR: ${{ runner.temp }}/mermaid-reference
        run: |
          seed=$(( $(od -An -N4 -tu4 /dev/urandom) % 2147483647 + 1 ))
          echo "Grammar finder seed: $seed"
          bun run eval:mermaid-grammar --native-only --fuzz 15000 --seed "$seed" --workers 4 --output grammar-finder

      - name: Classify retained witnesses against reviewed contracts
        id: triage
        if: ${{ steps.search.outcome == 'success' }}
        env:
          MERMAID_UPSTREAM_DIR: ${{ runner.temp }}/mermaid
          MERMAID_REFERENCE_DIR: ${{ runner.temp }}/mermaid-reference
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun run eval/mermaid-modern-compat/grammar-triage-run.ts --summary grammar-finder/summary.json --output grammar-finder/triage

      - name: File finite reports for untracked contract failures
        if: ${{ steps.triage.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          for file in grammar-finder/triage/issue-*.md; do
            IFS= read -r title < "$file"
            # This identifies one immutable run attempt, including a closed
            # report. It does not use issue history to classify source bytes.
            existing=$(gh issue list --state all --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number")
            if [ -z "$existing" ]; then
              tail -n +3 "$file" > finder-body.md
              gh issue create --title "$title" --body-file finder-body.md
            fi
          done

      # summary.json holds the seed, the counts and each reduced read's
      # unreduced input, and in-progress.json, left only by a run that did not
      # finish, the input it was in; the per-input JSONL files are too large.
      - name: Retain the finder summary
        if: ${{ always() && steps.search.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: grammar-finder-summary
          path: |
            grammar-finder/summary.json
            grammar-finder/in-progress.json
            grammar-finder/triage/
          retention-days: 90
          if-no-files-found: warn

      # Missing/failed triage is not a clean result. Search timeouts retain the
      # last input; triage/transport failures retain their completed evidence.
      - name: Report an incomplete search or triage
        if: ${{ always() && (steps.search.outcome != 'success' || steps.triage.outcome != 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SEARCH_OUTCOME: ${{ steps.search.outcome }}
          TRIAGE_OUTCOME: ${{ steps.triage.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Grammar finder did not complete (run $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT)"
          body="Search: \`${SEARCH_OUTCOME:-not started}\`; triage: \`${TRIAGE_OUTCOME:-not started}\`. The log names the failed stage and replay seed. This run does not establish a clean result. Run: $RUN_URL"
          if [ -s grammar-finder/in-progress.json ]; then
            body="$body"$'\n\nIt was last in this input, which may be what stalled it:\n\n`````json\n'"$(cat grammar-finder/in-progress.json)"$'\n`````'
          fi
          existing=$(gh issue list --state all --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number")
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "$body"
          fi
