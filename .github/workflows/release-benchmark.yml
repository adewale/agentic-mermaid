name: Release benchmark

# Performance, memory and correctness of the built package against a baseline
# npm release, measured on one runner in interleaved fresh Node processes.
# Called by publish.yml before the tarball is built; runnable on demand.

on:
  workflow_call:
    inputs:
      baseline:
        description: npm version or tag to compare against
        type: string
        default: latest
  workflow_dispatch:
    inputs:
      baseline:
        description: npm version or tag to compare against
        type: string
        default: latest

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark against agentic-mermaid@${{ inputs.baseline }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Build the candidate package
        run: bun run build

      - name: Benchmark candidate against the baseline release
        env:
          BASELINE: ${{ inputs.baseline }}
        run: bun run bench:release --baseline-npm "$BASELINE" --out bench-report

      - name: Upload the benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-benchmark-${{ github.sha }}
          path: bench-report/report.*
          if-no-files-found: warn
