name: Release benchmark

# Performance, memory and correctness of the built package against a baseline
# npm release, measured on one runner in interleaved fresh Node processes.
# Called by publish.yml with its verified publication artifact; runnable on demand.

on:
  workflow_call:
    inputs:
      candidate-artifact:
        description: Verified publication artifact from this workflow run (empty builds locally)
        type: string
        default: ''
      baseline:
        description: npm version or tag to compare against
        type: string
        default: latest
      layout-modes:
        description: Optional comma-separated elk,agentic,agentic-with-elk comparison arms
        type: string
        default: ''
      layout-cache:
        description: Geometry cache policy for layout comparisons
        type: string
        default: 'off'
  workflow_dispatch:
    inputs:
      layout-runtime-review:
        description: Run the fixed full27/native differential review instead of the normal release benchmark
        type: boolean
        default: false
      layout-cache-churn:
        description: Include bounded96/129/256 cache churn in the runtime review
        type: boolean
        default: false
      layout-runtime-campaign:
        description: Select one isolated runtime-review campaign or preserve the full review
        type: choice
        options: [all, release, differential, architecture, churn]
        default: all
      baseline:
        description: npm version or tag to compare against
        type: string
        default: latest
      layout-modes:
        description: Optional comma-separated elk,agentic,agentic-with-elk comparison arms
        type: string
        default: ''
      layout-cache:
        description: Geometry cache policy for layout comparisons
        type: choice
        options: ['off', normal]
        default: 'off'

      baseline-ref:
        description: Optional immutable Git commit instead of an npm baseline (on-demand only)
        type: string
        default: ''
      review-fixtures:
        description: Optional space-separated existing visual review fixture IDs
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  runtime-review:
    if: inputs.layout-runtime-review
    uses: ./.github/workflows/layout-runtime-review.yml
    with:
      baseline-ref: ${{ inputs.baseline-ref }}
      cache-churn: ${{ inputs.layout-cache-churn }}
      campaign: ${{ inputs.layout-runtime-campaign }}

  benchmark:
    if: ${{ !inputs.layout-runtime-review }}
    name: Benchmark against agentic-mermaid@${{ inputs.baseline }}
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Build the candidate package
        if: inputs.candidate-artifact == ''
        run: bun run build

      - name: Install the pinned npm
        run: |
          npm install -g npm@11.18.0 --ignore-scripts
          test "$(npm --version)" = "11.18.0"

      - name: Build an immutable Git baseline
        if: inputs.baseline-ref != ''
        env:
          BASELINE_REF: ${{ inputs.baseline-ref }}
        run: |
          [[ "$BASELINE_REF" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags origin "$BASELINE_REF"
          git worktree add --detach "$RUNNER_TEMP/benchmark-baseline" "$BASELINE_REF"
          cd "$RUNNER_TEMP/benchmark-baseline"
          bun install --frozen-lockfile
          bun run build
          mkdir -p "$GITHUB_WORKSPACE/benchmark-baseline"
          npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/benchmark-baseline"
          mv "$GITHUB_WORKSPACE"/benchmark-baseline/*.tgz "$GITHUB_WORKSPACE/benchmark-baseline/package.tgz"

      - name: Restore and resolve the immutable benchmark baseline
        if: inputs.baseline-ref == ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ inputs.baseline }}
          BASELINE_ARTIFACT: release-benchmark-baseline-${{ github.run_id }}
        run: |
          mkdir -p benchmark-baseline
          artifacts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == env.BASELINE_ARTIFACT and .expired == false) | .id')"
          if [ -n "$artifacts" ]; then
            gh run download "$GITHUB_RUN_ID" --name "$BASELINE_ARTIFACT" --dir benchmark-baseline
          elif [ "$GITHUB_RUN_ATTEMPT" -gt 1 ] && ! [[ "$BASELINE" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "The previous baseline artifact is unavailable. Start an on-demand run with an explicit previous npm version." >&2
            exit 1
          fi
          bun run eval/benchmark/release-baseline.ts "$BASELINE" benchmark-baseline/baseline.json

      - name: Persist the baseline before measuring
        if: inputs.baseline-ref == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-benchmark-baseline-${{ github.run_id }}
          path: benchmark-baseline/baseline.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Pack and verify the candidate package
        if: inputs.candidate-artifact == ''
        run: bun run scripts/ci/verify-publish-package.ts --pack-destination release-artifact

      - name: Download the verified publication artifact
        if: inputs.candidate-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.candidate-artifact }}
          path: release-artifact

      - name: Verify the candidate artifact identity
        run: |
          test "$(find release-artifact -mindepth 1 -maxdepth 1 -exec printf x \; | wc -c)" -eq 3
          for artifact_file in package.tgz package.sha256 package-manifest.json; do
            test -f "release-artifact/$artifact_file"
            test ! -L "release-artifact/$artifact_file"
          done
          test "$(jq -r '.schemaVersion' release-artifact/package-manifest.json)" = 1
          test "$(jq -r '.filename' release-artifact/package-manifest.json)" = package.tgz
          manifest_sha="$(jq -er '.sha256 | select(type == "string")' release-artifact/package-manifest.json)"
          test "${#manifest_sha}" -eq 64
          case "$manifest_sha" in *[!0-9a-f]*) exit 1;; esac
          printf '%s  package.tgz\n' "$manifest_sha" | cmp --silent - release-artifact/package.sha256
          actual_sha="$(sha256sum release-artifact/package.tgz | cut -d ' ' -f 1)"
          test "$actual_sha" = "$manifest_sha"
          manifest_integrity="$(jq -er '.integrity | select(type == "string")' release-artifact/package-manifest.json)"
          actual_integrity="$(node -e "const {createHash}=require('node:crypto'); const {readFileSync}=require('node:fs'); process.stdout.write('sha512-'+createHash('sha512').update(readFileSync('release-artifact/package.tgz')).digest('base64'))")"
          test "$actual_integrity" = "$manifest_integrity"

      - name: Record Git comparison provenance
        if: inputs.baseline-ref != ''
        env:
          BASELINE_REF: ${{ inputs.baseline-ref }}
        run: |
          test "$(git -C "$RUNNER_TEMP/benchmark-baseline" rev-parse HEAD)" = "$BASELINE_REF"
          mkdir -p bench-report
          jq -n --arg baselineRevision "$BASELINE_REF" --arg candidateRevision "$GITHUB_SHA" \
            --arg baselinePackageSha256 "$(sha256sum benchmark-baseline/package.tgz | cut -d ' ' -f 1)" \
            --arg candidatePackageSha256 "$(jq -er '.sha256' release-artifact/package-manifest.json)" \
            --arg baselineEntrySha256 "$(sha256sum "$RUNNER_TEMP/benchmark-baseline/dist/index.js" | cut -d ' ' -f 1)" \
            --arg candidateEntrySha256 "$(tar -xOf release-artifact/package.tgz package/dist/index.js | sha256sum | cut -d ' ' -f 1)" \
            '$ARGS.named' > bench-report/build-provenance.json

      - name: Generate requested visual review evidence
        if: inputs.review-fixtures != '' && inputs.baseline-ref != ''
        env:
          BASELINE_REF: ${{ inputs.baseline-ref }}
          REVIEW_FIXTURES: ${{ inputs.review-fixtures }}
        run: |
          read -r -a fixtures <<< "$REVIEW_FIXTURES"
          bun run scripts/pr-assets/meaning-preservation-evidence.ts "$BASELINE_REF" "$GITHUB_SHA" bench-report/visual "${fixtures[@]}"

      - name: Benchmark candidate against the Git baseline
        if: inputs.baseline-ref != ''
        run: |
          candidate_sha="$(jq -er '.sha256' release-artifact/package-manifest.json)"
          bun run bench:release --candidate-tarball release-artifact/package.tgz --candidate-sha256 "$candidate_sha" --baseline "$RUNNER_TEMP/benchmark-baseline" --out bench-report

      - name: Benchmark candidate against the baseline release
        if: inputs.baseline-ref == ''
        env:
          BASELINE: ${{ inputs.baseline }}
          LAYOUT_MODES: ${{ inputs.layout-modes }}
          LAYOUT_CACHE: ${{ inputs.layout-cache }}
        run: |
          candidate_sha="$(jq -er '.sha256' release-artifact/package-manifest.json)"
          layout_args=()
          if [ -n "$LAYOUT_MODES" ]; then
            layout_args+=(--layout-modes "$LAYOUT_MODES" --layout-cache "${LAYOUT_CACHE:-off}")
          fi
          bun run bench:release --candidate-tarball release-artifact/package.tgz --candidate-sha256 "$candidate_sha" --baseline-npm "$BASELINE" --baseline-lock benchmark-baseline/baseline.json --out bench-report "${layout_args[@]}"

      - name: Install Chromium for the advisory browser scorecard
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        # An unrelated apt repository can fail on the hosted image even when
        # Chromium's libraries are already installed. Still fetch the pinned
        # browser; the scorecard's real launch will verify its dependencies.
        run: bunx playwright install --with-deps chromium || bunx playwright install chromium

      - name: Measure exact-artifact browser and competitor performance
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 13
        env:
          BASELINE_REF: ${{ inputs.baseline-ref }}
        run: |
          candidate_sha="$(jq -er '.sha256' release-artifact/package-manifest.json)"
          baseline_args=(--baseline-lock benchmark-baseline/baseline.json)
          if [ -n "$BASELINE_REF" ]; then
            baseline_args=(--baseline-tarball benchmark-baseline/package.tgz --baseline-sha256 "$(sha256sum benchmark-baseline/package.tgz | cut -d ' ' -f 1)")
          fi
          timeout 12m bun run bench:release:browser --candidate-tarball release-artifact/package.tgz --candidate-sha256 "$candidate_sha" "${baseline_args[@]}" --out bench-report

      - name: Upload the benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-benchmark-${{ github.sha }}
          path: |
            bench-report/
            benchmark-baseline/baseline.json
          if-no-files-found: warn
          overwrite: true
