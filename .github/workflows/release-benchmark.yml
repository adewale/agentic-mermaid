# One-off evidence branch only. Root binds actual artifact inputs and reviews
# this file before publication/one dispatch; never a maintained product PR.
name: Exact release Sequence300 attribution
on:
  workflow_dispatch:
    inputs:
      study-run-id:
        description: Warm-A2 run containing the actual baseline package
        type: string
        required: true
        default: '40235414753'
      package-artifact-id:
        description: bounded-runtime-packages artifact ID from that run
        type: string
        required: true
        default: '12614488791'
      archive-sha256:
        description: Reviewed actual baseline/package/package.tgz SHA256
        type: string
        required: true
        default: '234fad0aea603fdda43e04c39bdeb5aa2e2b7c6a81940c4f86b15c689a3874f3'
      archive-integrity:
        description: Reviewed actual baseline tarball SHA512 SRI
        type: string
        required: true
        default: 'sha512-K2kuQVxbLaWTx+w4RArvIF2eePDvVR0h2BWgzBo39zipbqhM1qqlZTlLlm85j8QcKet/ZB52u8fACCxE6Y5gyw=='
permissions:
  contents: read
  actions: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: cc6fc54a322187c0b0e41408ca1bfe2e0724169b
          path: selected-source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install frozen tooling only; do not build a package
        run: |
          bun install --frozen-lockfile --ignore-scripts
          npm install -g npm@11.18.0 --ignore-scripts
          test "$(npm --version)" = '11.18.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.package-artifact-id }}
          run-id: ${{ inputs.study-run-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: bound-packages
      - name: Bind inputs and execute four serial diagnostics once
        env:
          STUDY_RUN: ${{ inputs.study-run-id }}
          PACKAGE_ARTIFACT: ${{ inputs.package-artifact-id }}
          ARCHIVE_SHA256: ${{ inputs.archive-sha256 }}
          ARCHIVE_INTEGRITY: ${{ inputs.archive-integrity }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, shutil
          assert re.fullmatch(r'\d+', os.environ['STUDY_RUN'])
          assert re.fullmatch(r'\d+', os.environ['PACKAGE_ARTIFACT'])
          assert re.fullmatch(r'[a-f0-9]{64}', os.environ['ARCHIVE_SHA256'])
          assert re.fullmatch(r'sha512-[A-Za-z0-9+/]+=*', os.environ['ARCHIVE_INTEGRITY'])
          root = pathlib.Path.cwd()
          helper = root / 'diagnostic/sequence300-profile'
          config = {'sourceRevision':'cc6fc54a322187c0b0e41408ca1bfe2e0724169b','harnessRoot':str(root),'sourceRoot':str(root/'selected-source'),'artifactRoot':str(root/'bound-packages'),'buildHarnessRevision':'3217d187829f0dd337e33c6a846f03c8bdb8961b','profileHarnessParent':'075b79edf14c3645f1eac3f9b81cb6d3efa7ccba','artifactRunId':os.environ['STUDY_RUN'],'artifactId':os.environ['PACKAGE_ARTIFACT'],'archiveSha256':os.environ['ARCHIVE_SHA256'],'archiveIntegrity':os.environ['ARCHIVE_INTEGRITY'],'prefix':str(pathlib.Path(os.environ['RUNNER_TEMP'])/'sequence300-consumer'),'out':str(root/'profile-evidence'),'node':shutil.which('node'),'bun':shutil.which('bun')}
          (helper/'job-config.json').write_text(json.dumps(config,indent=2))
          PY
          python3 diagnostic/sequence300-profile/acquire-and-profile.py diagnostic/sequence300-profile/job-config.json
      - name: Retain raw profiles, witnesses, populations and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exact-sequence300-attribution-${{ github.run_id }}
          path: |
            profile-evidence/
            diagnostic/sequence300-profile/
          if-no-files-found: error
          retention-days: 30
