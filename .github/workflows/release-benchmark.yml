name: Endpoint PR evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Generate public-render evidence at immutable production revisions
        run: |
          git fetch --no-tags origin 009159f93e6cea53f97ca53e416cf66b130c8e49 32989f8c7444b14bb5e10d06aeab4ade33d92faf aa9b6a74b9f660190f96e7c13e6e4e8718edf393
          cat > endpoint-proof.ts <<'ENDPOINT_PROOF'
          import { execFileSync } from 'node:child_process'
          import { mkdirSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          const out = join(process.cwd(), 'endpoint-evidence')
          mkdirSync(out, { recursive: true })
          const source = "flowchart TD\nA{\"rendered\"}\nB[\"ok\"]\nC[\"ok\"]\nD[\"ok\"]\nE[\"ok\"]\nF[\"process the input\"]\nG{\"ok\"}\nA --> B\nB --> C\nA --> D\nA --> E\nA --> F\nA --> G\nA -->|yes| G\n"
          writeFileSync(join(out, 'diamond.mmd'), source)
          const revisions = [
            ['before-main', '009159f93e6cea53f97ca53e416cf66b130c8e49'],
            ['before-endpoint', '32989f8c7444b14bb5e10d06aeab4ade33d92faf'],
            ['after', 'aa9b6a74b9f660190f96e7c13e6e4e8718edf393'],
          ]
          const render = `import {renderMermaidSVGWithReceipt} from './src/index.ts';
          try {const r=renderMermaidSVGWithReceipt(${JSON.stringify(source)}); console.log(JSON.stringify({ok:true,svg:r.svg,receipt:r.receipt}))}
          catch(e){console.log(JSON.stringify({ok:false,error:String(e.message)}))}`
          const results = []
          for (const [name, sha] of revisions) {
            const dir = join(process.env.RUNNER_TEMP, name)
            execFileSync('git', ['worktree','add','--detach',dir,sha])
            execFileSync('ln', ['-s',join(process.cwd(),'node_modules'),join(dir,'node_modules')])
            const result = JSON.parse(execFileSync('bun',['-e',render],{cwd:dir,encoding:'utf8'}))
            if (result.ok !== (name === 'after')) throw new Error(`Unexpected ${name} result`)
            if (result.ok) {
              writeFileSync(join(out,name+'.svg'),result.svg)
              writeFileSync(join(out,name+'-receipt.json'),JSON.stringify(result.receipt,null,2))
              const { Resvg } = await import('@resvg/resvg-js')
              writeFileSync(join(out,name+'.png'), new Resvg(result.svg,{font:{fontFiles:[join(process.cwd(),'assets/fonts/Inter-Regular.ttf')],loadSystemFonts:false}}).render().asPng())
            } else writeFileSync(join(out,name+'-error.txt'),result.error)
            results.push({name,sha,ok:result.ok,...(result.ok?{svgBytes:Buffer.byteLength(result.svg)}:{error:result.error})})
          }
          writeFileSync(join(out,'comparison.json'),JSON.stringify({source,revisions:results,limitation:'Bounded example only; no arbitrary diagram or font/viewer guarantee.'},null,2))
          writeFileSync(join(out,'review.html'),`<!doctype html><meta charset="utf-8"><title>PR 466 endpoint evidence</title><h1>Same-input endpoint recovery</h1><p>Before: public rendering rejects the diamond endpoint, so no valid before image exists.</p><pre>${results[0].error.replaceAll('&','&amp;').replaceAll('<','&lt;')}</pre><p>After: inspect both A-to-G connections and the yes label meeting the diamond outline.</p><img src="after.png" alt="After: the seven-node diagram renders with both A-to-G connections meeting the diamond outline"><p>See comparison.json for immutable source revisions and the input. The local benchmark report is historical evidence from the prior session, not measurements run by this workflow.</p>`)

          ENDPOINT_PROOF
          bun endpoint-proof.ts
          python3 - <<'REPORT'
          import base64,gzip
          from pathlib import Path
          Path("endpoint-evidence/local-benchmark-report.json").write_bytes(gzip.decompress(base64.b64decode("")))
          REPORT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: endpoint-misses-aa9b6a74
          path: endpoint-evidence/
          if-no-files-found: error
          retention-days: 30
