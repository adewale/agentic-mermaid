name: Forest audit evidence
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Immutable main revision
        type: string
        required: true
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASELINE: ${{ inputs.baseline }}
      CANDIDATE: 9321554736bc38be14b41b171b54f1a566d1cb01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9321554736bc38be14b41b171b54f1a566d1cb01
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
          no-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Measure opt-in, default cache, flag-off and A/A controls
        run: |
          mkdir -p bench-report/audit
          AGENTIC_MERMAID_EXPERIMENTS=indexed-layout bun run bench:micro --runtime node --baseline "$BASELINE" --rounds 3 --elk-cache off --filter '^render:svg-consumed-(tree50|mesh50|seq20)$' --json bench-report/audit/uncached.json
          AGENTIC_MERMAID_EXPERIMENTS=indexed-layout bun run bench:micro --runtime node --baseline "$BASELINE" --rounds 3 --elk-cache on --filter '^render:svg-consumed-tree50$' --json bench-report/audit/cached.json
          AGENTIC_MERMAID_EXPERIMENTS= bun run bench:micro --runtime node --baseline "$BASELINE" --rounds 3 --elk-cache off --filter '^render:svg-consumed-(tree50|mesh50|seq20)$' --json bench-report/audit/flag-off.json
          AGENTIC_MERMAID_EXPERIMENTS=indexed-layout bun run bench:micro --runtime node --baseline "$CANDIDATE" --rounds 3 --elk-cache off --filter '^render:svg-consumed-(tree50|mesh50|seq20)$' --json bench-report/audit/aa.json
      - name: Qualify the complete documentation inventory
        env:
          AGENTIC_MERMAID_SCENE_ASSERTIONS: '1'
          AGENTIC_MERMAID_ELK_CACHE: '0'
        run: bun run eval/benchmark/qualify-performance-profile.ts --features indexed-layout --out bench-report/audit/qualification.json
      - name: Render the same forest through immutable base and candidate
        run: |
          git worktree add --detach /tmp/forest-base "$BASELINE"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/forest-base/node_modules
          cat > bench-report/audit/input.mmd <<'MMD'
          flowchart TD
          A[Receive authored graph] --> B[Measure labels]
          A --> C[Keep semantic identities]
          B --> D[Position variable sized nodes]
          B --> E[Preserve source spans]
          C --> F[Connect actual outlines]
          C --> G[Certify final geometry]
          H[Disconnected component] --> I[Keep its label]
          MMD
          cat > bench-report/forest-evidence.ts <<'TS'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { Resvg } from '@resvg/resvg-js'
          const [root,label]=process.argv.slice(2)
          const api=await import(`${root}/src/index.ts`)
          const svg=api.renderMermaidSVG(readFileSync('bench-report/audit/input.mmd','utf8'),{bg:'#ffffff',fg:'#18181b',embedFontImport:false})
          writeFileSync(`bench-report/audit/${label}.svg`,svg)
          const fontFiles=['Inter-Regular.ttf','Inter-Medium.ttf','Inter-SemiBold.ttf','Inter-Bold.ttf'].map(name=>`${process.cwd()}/assets/fonts/${name}`)
          writeFileSync(`bench-report/audit/${label}.png`,new Resvg(svg,{background:'#ffffff',font:{loadSystemFonts:false,fontFiles},fitTo:{mode:'width',value:1200}}).render().asPng())
          TS
          AGENTIC_MERMAID_EXPERIMENTS= bun run bench-report/forest-evidence.ts /tmp/forest-base before
          AGENTIC_MERMAID_EXPERIMENTS=indexed-layout bun run bench-report/forest-evidence.ts "$GITHUB_WORKSPACE" after
          git diff "$BASELINE" "$CANDIDATE" --stat > bench-report/audit/diff-stat.txt
          node -e 'require("node:fs").writeFileSync("bench-report/audit/receipt.json",JSON.stringify({base:process.env.BASELINE,head:process.env.CANDIDATE,experiment:"indexed-layout",controls:["flag-off","A/A"],cacheModes:["off","on"],rounds:3,consumption:"UTF-8 SVG and serialized complete receipt",allocation:"V8 JS heap estimate only"},null,2))'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: forest-audit-9321554736bc38be14b41b171b54f1a566d1cb01
          path: bench-report/audit/
          if-no-files-found: error
