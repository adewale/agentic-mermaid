name: Modern Mermaid semantic compatibility

# This semantic gate does not require Mermaid's layout, appearance or
# rejection policy to become the product's rendering contract.
on:
  # Canonical CI calls this lane for every revision, including changes to
  # reference policy and corpus inputs outside src/. Its result gates release.
  workflow_call:
    inputs:
      mutations_per_family:
        description: Seeded diagnostic mutations per modern core family
        type: number
        default: 100
  workflow_dispatch:
    inputs:
      mutations_per_family:
        description: Seeded mutations for each modern core diagram family
        type: number
        default: 5000
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install project dependencies
        run: bun install --frozen-lockfile
      - name: Install the independent pinned reference
        id: reference
        run: |
          mermaid_version=$(bun -e 'import policy from "./docs/project/upstream-mermaid-policy.json"; process.stdout.write(policy.pin.version)')
          mermaid_commit=$(bun -e 'import policy from "./docs/project/upstream-mermaid-policy.json"; process.stdout.write(policy.pin.commit)')
          git clone --depth 1 --single-branch --branch "mermaid@$mermaid_version" https://github.com/mermaid-js/mermaid.git "$RUNNER_TEMP/mermaid"
          git -C "$RUNNER_TEMP/mermaid" checkout --detach "$mermaid_commit"
          parser_version=$(bun -e 'import {readFileSync} from "node:fs"; process.stdout.write(JSON.parse(readFileSync(process.argv[1], "utf8")).version)' "$RUNNER_TEMP/mermaid/packages/parser/package.json")
          npm install --prefix "$RUNNER_TEMP/mermaid-reference" --save-exact --no-audit --no-fund "mermaid@$mermaid_version" "@mermaid-js/parser@$parser_version" jsdom@26.1.0
      - name: Assert public semantic preservation against the current Mermaid pin
        env:
          MERMAID_UPSTREAM_DIR: ${{ runner.temp }}/mermaid
          MERMAID_REFERENCE_DIR: ${{ runner.temp }}/mermaid-reference
        run: bun run test:mermaid-modern
      - name: Record modern documentation and seeded mutation diagnostics
        if: ${{ always() && !cancelled() && steps.reference.outcome == 'success' }}
        continue-on-error: true
        run: |
          bun run eval:mermaid-modern --mermaid-dir "$RUNNER_TEMP/mermaid" --reference-dir "$RUNNER_TEMP/mermaid-reference" --fuzz 100 --seed 7
      - name: Compare all-family native admission and real grammar round trips
        if: ${{ always() && !cancelled() && steps.reference.outcome == 'success' }}
        env:
          MERMAID_UPSTREAM_DIR: ${{ runner.temp }}/mermaid
          MERMAID_REFERENCE_DIR: ${{ runner.temp }}/mermaid-reference
          GRAMMAR_FUZZ: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.mutations_per_family) || github.event_name == 'schedule' && '5000' || format('{0}', inputs.mutations_per_family) }}
        run: bun run eval:mermaid-grammar --fuzz "$GRAMMAR_FUZZ" --seed 7 --workers 4
      - name: Retain assertions and separate diagnostic gaps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: modern-mermaid-semantic-results
          path: |
            eval/mermaid-modern-compat/output/semantic-gate.json
            eval/mermaid-modern-compat/output/native-operations-gate.json
            eval/mermaid-modern-compat/output/grammar-regressions-gate.json
            eval/mermaid-modern-compat/output/summary.json
            eval/mermaid-modern-compat/output/cases.json
            eval/mermaid-modern-compat/output/grammar/
          retention-days: 7
          if-no-files-found: warn
