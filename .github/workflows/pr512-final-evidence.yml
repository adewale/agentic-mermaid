name: PR512 frozen exact-head CI
on:
  push:
    branches: [codex/pr512-7771-evidence-20261026]
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch CI at the frozen final source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/adewale/agentic-mermaid/git/ref/heads/codex/pr512-7771-qualification-20261026 --jq .object.sha)" = 7771ad9ffe94db5c4aacad5dac5d10b1584bad01
          gh api --method POST repos/adewale/agentic-mermaid/actions/workflows/ci.yml/dispatches --input - <<'JSON'
          {"ref":"codex/pr512-7771-qualification-20261026"}
          JSON
