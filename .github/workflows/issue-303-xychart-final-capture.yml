name: Temporary issue 303 XY Chart final-source capture

on:
  push:
    branches:
      - codex/303-color-agreement

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - run: bun run scripts/pr-assets/linkrank-feedback-packing-evidence.ts --receipt-only
      - run: bun run scripts/pr-assets/mermaid-doc-showcase-gallery.ts --receipt-only
      - run: bun run scripts/pr-assets/mindmap-gitgraph-content-gallery.ts --receipt-only
      - run: bun run scripts/pr-assets/palette-rollout-evidence.ts --receipt-only
      - run: bun run scripts/pr-assets/pie-highlightslice-evidence.ts --receipt-only
      - run: bun run scripts/pr-assets/section-b-brand-evidence.ts --receipt-only
      - uses: actions/upload-artifact@v7
        with:
          name: issue-303-xychart-linux-receipts
          path: |
            eval/linkrank-feedback-packing/evidence-receipt.json
            eval/mermaid-doc-showcase/gallery-receipt.json
            eval/mindmap-gitgraph-content-corpus/gallery-receipt.json
            eval/palette-rollout/evidence-receipt.json
            eval/pie-highlightslice/evidence-receipt.json
            eval/section-b-brand-evidence/evidence-receipt.json
          if-no-files-found: error
      - name: Widen budgets in this temporary capture runner only
        run: |
          bun -e 'import { readFileSync, writeFileSync } from "node:fs"; const path = "scripts/build/browser-lazy-budgets.json"; const budget = JSON.parse(readFileSync(path, "utf8")); for (const row of [budget.initial, ...Object.values(budget.families)]) { row.requests += 2; for (const key of ["raw", "gzip", "brotli"]) row[key] += 10000; } writeFileSync(path, JSON.stringify(budget, null, 2) + "\n");'
          bun -e 'import { readFileSync, writeFileSync } from "node:fs"; const path = "scripts/site/website-payload-budgets.ts"; const source = readFileSync(path, "utf8"); writeFileSync(path, source.replace(/(max(?:Requests|RawBytes|GzipBytes|BrotliBytes):\s*)([\d_]+)/g, (_, prefix, raw) => prefix + String(Number(raw.replaceAll("_", "")) + (prefix.includes("Requests") ? 2 : 10000))));'
      - run: bun run website:payload:write
      - uses: actions/upload-artifact@v7
        with:
          name: issue-303-xychart-linux-payload
          path: eval/website-payload/baseline.json
          if-no-files-found: error
      - run: bun run build
      - run: bun run scripts/build/browser-lazy-report.ts --json > /tmp/am338-lazy.json
      - uses: actions/upload-artifact@v7
        with:
          name: issue-303-xychart-linux-lazy
          path: /tmp/am338-lazy.json
          if-no-files-found: error
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install -g npm@11.18.0 --ignore-scripts
      - run: npm pack --dry-run --json --ignore-scripts > /tmp/am338-pack.json
      - uses: actions/upload-artifact@v7
        with:
          name: issue-303-xychart-linux-pack
          path: /tmp/am338-pack.json
          if-no-files-found: error
