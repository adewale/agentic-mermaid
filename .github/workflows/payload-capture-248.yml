name: 'Temporary #248 payload capture'

on:
  pull_request:
    branches: [main]

jobs:
  payload-capture:
    if: github.head_ref == 'codex/issue-264-sequence-rect-color'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium --with-deps
      - run: bun run scripts/site/website-payload-report.ts --write --capture-unreviewed
      - uses: actions/upload-artifact@v7
        with:
          name: issue-248-unreviewed-linux-payload
          path: eval/website-payload/baseline.json
          retention-days: 1
