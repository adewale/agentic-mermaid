name: Temporary issue 303 Architecture mixed-paint payload capture

on:
  push:
    branches:
      - codex/248-mainbkg-none

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - run: bun run website:payload:write
      - uses: actions/upload-artifact@v7
        with:
          name: issue-303-architecture-mixed-linux-payload-v2
          path: eval/website-payload/baseline.json
          if-no-files-found: error
      - run: bun run build
      - run: npm pack --dry-run --json --ignore-scripts > /tmp/am334-pack.json
      - uses: actions/upload-artifact@v7
        with:
          name: issue-303-architecture-mixed-linux-pack-v2
          path: /tmp/am334-pack.json
          if-no-files-found: error
