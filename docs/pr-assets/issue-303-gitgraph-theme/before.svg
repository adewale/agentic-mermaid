<svg xmlns="http://www.w3.org/2000/svg" width="333.439" height="301.714" viewBox="0 0 333.439 301.714" style="--bg:#FFFFFF;--fg:#27272A;--font:Inter;background:#FFFFFF" aria-labelledby="gitgraph-title" aria-roledescription="git graph" role="img">
<style>
  text { font-family: var(--font, 'Inter'), system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          #27272A;
    --_text-sec:      #575759;
    --_text-muted:    #707072;
    --_text-faint:    #8a8a8c;
    --_line:          #939395;
    --_arrow:         #47474a;
    --_node-fill:     #f9f9f9;
    --_node-stroke:   #d4d4d4;
    --_group-fill:    #FFFFFF;
    --_group-hdr:     #f4f4f4;
    --_inner-stroke:  #e5e5e5;
    --_key-badge:     #e9e9ea;
  }
</style>
<title id="gitgraph-title">Git graph</title>
<g class="git-branch" data-id="branch:main" data-branch="main" data-role="group">
  <rect class="git-branch-label-background" x="82.28" y="32.714" width="37.72" height="18" rx="4" fill="#FFFFFF" stroke="notacolor" stroke-width="1" />
  <line class="git-branch-line" data-branch="main" x1="130" y1="45.714" x2="166.178" y2="45.714" stroke="notacolor" stroke-width="3" opacity="0.86" />
  <text class="git-branch-label" data-branch="main" x="120" y="45.714" text-anchor="end" font-size="12" font-weight="600" fill="notacolor" textLength="27.72" lengthAdjust="spacingAndGlyphs" data-font-metrics="deterministic-fit">main</text>
</g>
<g class="git-branch" data-id="branch:feature" data-branch="feature" data-role="group">
  <rect class="git-branch-label-background" x="67.88" y="114.714" width="52.12" height="18" rx="4" fill="#e9f0f7" stroke="#0d5ba5" stroke-width="1" />
  <line class="git-branch-line" data-branch="feature" x1="130" y1="127.714" x2="260.178" y2="127.714" stroke="#0d5ba5" stroke-width="3" opacity="0.86" />
  <text class="git-branch-label" data-branch="feature" x="120" y="127.714" text-anchor="end" font-size="12" font-weight="600" fill="#0d5ba5" textLength="42.12" lengthAdjust="spacingAndGlyphs" data-font-metrics="deterministic-fit">feature</text>
</g>
<polyline class="git-edge git-edge-parent" data-from="base" data-to="feature" points="166.178,45.714 213.178,45.714 213.178,127.714 260.178,127.714" fill="none" stroke="#0d5ba5" stroke-width="2" data-relationship="parent" data-direction="forward" data-id="base-&gt;feature" data-role="edge" role="graphics-symbol" aria-roledescription="relation" aria-label="base to feature" />
<g class="git-commit type-normal" data-id="base" data-branch="main" data-commit-type="NORMAL" data-role="node">
  <circle cx="166.178" cy="45.714" r="8" fill="#f9f9f9" stroke="notacolor" stroke-width="2" />
  <rect class="git-commit-label-background" x="140.813" y="58.714" width="50.73" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94" stroke="notacolor" stroke-width="0.75" transform="rotate(45 166.178 69.714)" />
  <text class="git-commit-label" x="166.178" y="69.714" text-anchor="middle" font-size="11" fill="#575759" transform="rotate(45 166.178 69.714)" textLength="25.41" lengthAdjust="spacingAndGlyphs" data-font-metrics="deterministic-fit">base</text>
</g>
<g class="git-commit type-normal" data-id="feature" data-branch="feature" data-commit-type="NORMAL" data-role="node">
  <circle cx="260.178" cy="127.714" r="8" fill="#d3e1ef" stroke="#0d5ba5" stroke-width="2" />
  <rect class="git-commit-label-background" x="229.797" y="140.714" width="60.762" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94" stroke="#0d5ba5" stroke-width="0.75" transform="rotate(45 260.178 151.714)" />
  <text class="git-commit-label" x="260.178" y="151.714" text-anchor="middle" font-size="11" fill="#575759" transform="rotate(45 260.178 151.714)" textLength="34.914" lengthAdjust="spacingAndGlyphs" data-font-metrics="deterministic-fit">feature</text>
</g>
</svg>